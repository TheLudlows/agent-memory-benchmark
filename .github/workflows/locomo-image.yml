name: LoCoMo runner image

on:
  pull_request:
    paths: &image_paths
      - Dockerfile
      - Dockerfile.dockerignore
      - compose.yaml
      - src/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/locomo-image.yml
  push:
    branches: [main]
    paths: *image_paths
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build runner
        run: docker compose build amb
      - name: Validate packaged CLI and dataset offline
        run: |
          docker run --rm --network none amb-locomo:local dataset-stats --dataset locomo
          docker run --rm --network none --entrypoint python amb-locomo:local -c "
          from memory_bench.dataset.locomo import LoComoDataset
          from memory_bench.memory import get_memory_provider
          from memory_bench.utils import count_tokens
          assert len(LoComoDataset().load_queries('locomo10')) == 1540
          assert get_memory_provider('hindsight-http').name == 'hindsight-http'
          assert count_tokens('LoCoMo') > 0"
      - name: Export tested image
        if: github.event_name == 'pull_request'
        run: docker save amb-locomo:local | gzip -1 > "$RUNNER_TEMP/amb-locomo-linux-amd64.tar.gz"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: amb-locomo-linux-amd64
          path: ${{ runner.temp }}/amb-locomo-linux-amd64.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Publish tested image to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag amb-locomo:local "$image:sha-$GITHUB_SHA"
          docker tag amb-locomo:local "$image:latest"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"

  workbench:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build and start Workbench
        run: docker compose up --build --detach amb-web
      - name: Verify Workbench HTTP and static UI
        run: |
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 2 \
            http://127.0.0.1:8090/api/config -o "$RUNNER_TEMP/workbench-config.json"
          python -c "import json, sys; assert 'contextbase' in json.load(open(sys.argv[1]))['backends']" \
            "$RUNNER_TEMP/workbench-config.json"
          curl --fail --silent --show-error http://127.0.0.1:8090/ -o "$RUNNER_TEMP/workbench.html"
          grep -q 'evaluation-name' "$RUNNER_TEMP/workbench.html"
          curl --fail --silent --show-error http://127.0.0.1:8090/assets/workbench.js -o /dev/null
      - name: Show Workbench logs
        if: failure()
        run: docker compose logs amb-web
      - name: Stop Workbench
        if: always()
        run: docker compose --profile web down --volumes
