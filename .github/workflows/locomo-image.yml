name: LoCoMo runner image

on:
  pull_request:
    paths: &image_paths
      - Dockerfile
      - Dockerfile.dockerignore
      - compose.yaml
      - src/**
      - data/offline/**
      - data/beam/**
      - data/longmemeval/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/locomo-image.yml
  push:
    branches: [main]
    paths: *image_paths
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build runner
        run: docker compose build amb
      - name: Validate packaged CLI and datasets offline
        run: |
          docker run --rm --network none amb-locomo:local dataset-stats --dataset locomo
          docker run --rm --network none --entrypoint python amb-locomo:local -c "
          from memory_bench.dataset import get_dataset
          from memory_bench.memory import get_memory_provider
          from memory_bench.utils import count_tokens
          splits = {'locomo': {'locomo10': 1540}, 'longmemeval': {'s': 500},
                    'beam': {'100k': 400, '500k': 700, '1m': 700, '10m': 200},
                    'lifebench-v2': {'zh': 3380}, 'precisionmembench': {'single-turn': 77}}
          for name, sizes in splits.items():
              dataset = get_dataset(name)
              for split, size in sizes.items():
                  queries = dataset.load_queries(split)
                  assert len(queries) == size, (name, split, len(queries))
                  assert dataset.load_documents(split, user_ids={queries[0].user_id}, limit=1), (name, split)
          assert get_memory_provider('hindsight-http').name == 'hindsight-http'
          assert count_tokens('LoCoMo') > 0"
      - name: Export tested image
        if: github.event_name == 'pull_request'
        run: docker save amb-locomo:local | gzip -1 > "$RUNNER_TEMP/amb-locomo-linux-amd64.tar.gz"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: amb-locomo-linux-amd64
          path: ${{ runner.temp }}/amb-locomo-linux-amd64.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
      - name: Publish tested image to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag amb-locomo:local "$image:sha-$GITHUB_SHA"
          docker tag amb-locomo:local "$image:latest"
          docker push "$image:sha-$GITHUB_SHA"
          docker push "$image:latest"
