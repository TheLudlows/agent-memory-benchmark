name: AMB Workbench image

on:
  pull_request:
    paths: &image_paths
      - Dockerfile
      - Dockerfile.dockerignore
      - compose.yaml
      - src/**
      - data/offline/**
      - data/beam/**
      - data/lifebench/**
      - data/longmemeval/**
      - data/personamem/**
      - pyproject.toml
      - uv.lock
      - .env.example
      - deploy/ecs-user-data.sh
      - .github/workflows/workbench-image.yml
  push:
    branches: [main]
    paths: *image_paths
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate ECS boot script
        run: bash -n deploy/ecs-user-data.sh
      - name: Build Linux AMD64 Workbench image
        run: |
          docker build --platform linux/amd64 --target workbench \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t amb-workbench:local .
      - name: Verify datasets and tokenizer offline
        run: |
          docker run --rm --network none -i --entrypoint python amb-workbench:local - <<'PY'
          from memory_bench.dataset import get_dataset
          from memory_bench.dataset.personamem_offline import OfflinePersonaMemDataset
          from memory_bench.utils import count_tokens

          assert count_tokens('Agent Memory Benchmark') > 0
          vidore = get_dataset('vidore-v3-markdown')
          assert len(vidore.load_queries('computer_science')) == 1290
          assert len(vidore.load_documents('computer_science')) == 1358
          legalbench = get_dataset('legalbench-rag')
          assert len(legalbench.load_queries('mini')) == 776
          assert len(legalbench.load_documents('mini')) == 714
          splits = {
              'locomo': {'locomo10': 1540},
              'beam': {'100k': 400, '500k': 700, '1m': 700, '10m': 200},
              'longmemeval': {'s': 500},
              'lifebench': {'en': 2003},
              'lifebench-v2': {'zh': 3380},
              'precisionmembench': {'single-turn': 77},
          }
          for name, sizes in splits.items():
              dataset = get_dataset(name)
              for split, expected in sizes.items():
                  queries = dataset.load_queries(split)
                  assert len(queries) == expected, (name, split, len(queries))
                  docs = dataset.load_documents(split, user_ids={queries[0].user_id}, limit=1)
                  assert docs and docs[0].content.strip(), (name, split)
                  print(f'{name}/{split}: {len(queries)} questions')
          for split, expected in {'32k': 589, '128k': 2727, '1M': 2674}.items():
              dataset = OfflinePersonaMemDataset(split)
              queries = dataset.load_queries(split)
              assert len(queries) == expected
              docs = dataset.load_documents(split, user_ids={queries[0].user_id}, limit=1)
              assert docs and docs[0].messages
              print(f'personamem/{split}: {len(queries)} questions')
          PY
      - name: Start the Workbench offline
        run: |
          docker run --detach --network none --name amb-workbench-smoke \
            --env AMB_WORKBENCH_ALLOWED_HOSTS=amb.example.test amb-workbench:local
          trap 'docker logs amb-workbench-smoke; docker rm -f amb-workbench-smoke' EXIT
          docker exec -i amb-workbench-smoke python - <<'PY'
          import json
          import time
          from urllib.error import URLError
          from urllib.request import Request, urlopen

          base_url = 'http://127.0.0.1:8090'
          for attempt in range(30):
              try:
                  with urlopen(f'{base_url}/api/config', timeout=2) as response:
                      config = json.load(response)
                  break
              except URLError:
                  if attempt == 29:
                      raise
                  time.sleep(1)
          assert config['datasets'] == {
              'locomo': ['locomo10'],
              'beam': ['100k', '500k', '1m', '10m'],
              'longmemeval': ['s'],
              'lifebench': ['en'],
              'lifebench-v2': ['zh'],
              'personamem': ['32k', '128k', '1M'],
              'precisionmembench': ['single-turn'],
          }, config['datasets']
          assert set(config['backends']) == {'contextbase', 'mem0-cloud', 'hindsight-http'}
          with urlopen(f'{base_url}/knowledge/api/config', timeout=2) as response:
              knowledge = json.load(response)
          assert 'computer_science' in knowledge['datasets']['vidore-v3-markdown']
          assert 'computer_science' not in knowledge['split_errors'].get('vidore-v3-markdown', {})
          assert knowledge['datasets']['legalbench-rag'] == ['mini']
          assert 'mini' not in knowledge['split_errors']['legalbench-rag']
          remote_config = Request(f'{base_url}/api/config', headers={'Host': 'amb.example.test:8090'})
          with urlopen(remote_config, timeout=2) as response:
              assert json.load(response)['datasets'] == config['datasets']
          with urlopen(f'{base_url}/', timeout=2) as response:
              assert b'evaluation-name' in response.read()
          for path in ('/assets/workbench.js', '/assets/workbench.css'):
              with urlopen(f'{base_url}{path}', timeout=2) as response:
                  assert response.read(), path
          PY
      - name: Publish tested image to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag amb-workbench:local "$image:workbench-sha-$GITHUB_SHA"
          docker tag amb-workbench:local "$image:workbench"
          docker push "$image:workbench-sha-$GITHUB_SHA"
          docker push "$image:workbench"
          docker buildx imagetools inspect "$image:workbench-sha-$GITHUB_SHA"
      - name: Export tested image and SHA-256 checksum
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          docker save amb-workbench:local | gzip -1 > amb-workbench-linux-amd64.tar.gz
          sha256sum amb-workbench-linux-amd64.tar.gz > amb-workbench-linux-amd64.tar.gz.sha256
          cp "$GITHUB_WORKSPACE/deploy/ecs-user-data.sh" ecs-user-data.sh
      - uses: actions/upload-artifact@v4
        with:
          name: amb-workbench-linux-amd64
          path: |
            ${{ runner.temp }}/amb-workbench-linux-amd64.tar.gz
            ${{ runner.temp }}/amb-workbench-linux-amd64.tar.gz.sha256
            ${{ runner.temp }}/ecs-user-data.sh
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
