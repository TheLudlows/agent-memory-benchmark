[project]
name = "amb"
version = "0.1.0"
description = "Open Memory Benchmark"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.0",
    "typer>=0.12",
    "rich>=13",
    "rank-bm25>=0.2",
    "google-genai>=1.66.0",
    "mem0ai>=1.0.5",
    "cognee>=0.5.4",
    "sentence-transformers>=3.0",
    "python-dotenv>=1.0",
    "hindsight-all>=0.4",
    # Client pinned ahead of hindsight-all: 0.4.x predates tag_groups / min_scores /
    # entity-label tags. The server package (hindsight-api-slim) cannot move to 0.9.x yet
    # because it requires protobuf>=7.35.1 while mem0ai caps protobuf<7.
    "hindsight-client>=0.9.2",
    "supermemory>=0.1",
    "httpx>=0.27",
    "qdrant-client>=1.13",
    "fastapi[standard]>=0.135.1",
    "ijson>=3.3",
    "uvicorn>=0.41.0",
    "tiktoken>=0.12.0",
    "groq>=1.1.1",
    "scipy>=1.11",
]

# CLI and client dependencies for LoCoMo against an external Hindsight API.
[dependency-groups]
http-runner = [
    "google-genai", "groq", "hindsight-client", "httpx", "openai",
    "python-dotenv", "qdrant-client", "rank-bm25", "rich", "scipy", "tiktoken", "typer",
]

workbench = ["datasets", "fastapi", "ijson", "mem0ai", "pillow", "pypdfium2", "uvicorn"]

[project.scripts]
amb = "memory_bench.cli:app"
omb = "memory_bench.cli:app"  # legacy alias (pre-rename); prefer `amb`

[tool.uv]
# hindsight-api declares `uvloop` unconditionally, but uvloop does not build on
# Windows (it relies on libuv/epoll). Override it to install only off-Windows so
# `uv run amb workbench` works on Windows (asyncio falls back to its default loop).
override-dependencies = ["uvloop; sys_platform != 'win32'"]

[tool.hatch.build.targets.wheel]
packages = ["src/memory_bench"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
